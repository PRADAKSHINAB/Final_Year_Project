# VisDrone-DET 2019 — Faster R-CNN Research Configuration
# ==========================================================
# This is the SINGLE CANONICAL config file.
# All four experiments (E1-E4) use identical training settings.
# Only the model architecture flags differ.
#
# Dataset paths (relative to project root):
#   Train: Dataset/VisDrone2019-DET-train/VisDrone2019-DET-train/
#   Val:   Dataset/VisDrone2019-DET-val/
#
# Before training, run:
#   python research/prepare_dataset.py --yes

dataset:
  # Primary dataset root — used by visdrone.py
  # Each split has its own root due to VisDrone's folder layout
  train_root: "Dataset/VisDrone2019-DET-train/VisDrone2019-DET-train"
  val_root:   "Dataset/VisDrone2019-DET-val"
  # Legacy compatibility alias (used by older code)
  root:       "Dataset/VisDrone2019-DET-val"
  num_classes: 11   # 10 foreground + 1 background
  num_fg_classes: 10

model:
  backbone: "resnet50"
  pretrained_backbone: true
  freeze_backbone_epochs: 5   # Freeze layers 1-3 for first 5 epochs
  anchor_sizes: [[16], [32], [64], [128], [256]]
  anchor_ratios: [0.5, 1.0, 2.0, 3.0]
  min_size: 640
  max_size: 1280
  box_score_thresh: 0.05
  box_nms_thresh: 0.5
  box_detections_per_img: 300

optimizer:
  type: "SGD"
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  nesterov: true

scheduler:
  type: "cosine"
  warmup_epochs: 3
  eta_min: 0.00001

training:
  amp: true                      # Automatic Mixed Precision (FP16)
  grad_clip: 10.0                # Gradient clipping norm
  log_interval: 50               # Steps between console logs
  early_stopping_patience: 20    # Epochs without improvement before stopping

output:
  experiment_dir: "experiments"
  results_dir:    "results"
  checkpoint_dir: "checkpoints"

attention:
  type: "coordinate_attention"
  location: "fpn_output"         # CA applied at FPN output P2/P3
  reduction_ratio: 32

scale_aware_rpn:
  scale_bins: 4
  context_channels: 64

seed: 42

# ──────────────────────────────────────────────────────────────────────────────
# DEBUG MODE — small subset, small image, few epochs
# Run first to verify everything works before full training.
# ──────────────────────────────────────────────────────────────────────────────
debug:
  epochs: 5
  img_size: 640
  batch_size: 2
  workers: 2
  subset_fraction: 0.05   # 5% of training data (~324 images)

# ──────────────────────────────────────────────────────────────────────────────
# RESEARCH MODE — full dataset, publication settings
# Run ONLY after debug mode passes.
# ──────────────────────────────────────────────────────────────────────────────
research:
  epochs: 100
  img_size: 1280
  batch_size: 4              # Safe for H200 with AMP; increase to 8 if memory allows
  workers: 8
  subset_fraction: 1.0       # Full dataset

# ──────────────────────────────────────────────────────────────────────────────
# BATCH SIZE GUIDANCE for H200 NVL (~140 GB VRAM)
# At img_size=1280, ResNet50-FPN Faster R-CNN uses ~8-12 GB per image (with AMP).
# batch_size=4: ~32-48 GB VRAM — very safe
# batch_size=8: ~64-96 GB VRAM — safe on H200
# batch_size=16: ~128-192 GB — may OOM; test with check_hpc.py first
# Recommended: start with batch_size=4, then run:
#   python research/check_hpc.py --batch_test
# ──────────────────────────────────────────────────────────────────────────────
